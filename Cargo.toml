[workspace]
members = [
    "crates/speed-precise-core",
    "crates/speed-precise-cli",
    "crates/speed-precise-gui",
]
resolver = "2"

[workspace.package]
version = "1.0.2"
edition = "2021"
authors = ["Speed Precise Engineering"]
license = "MIT"
repository = "https://github.com/FellipeW0/Speed-Precise"

[workspace.dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
egui_plot = "0.29"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
